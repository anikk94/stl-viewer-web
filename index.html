<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>STL Viewer - Move, Rotate, and Scale Models</title>
  <style>
    body { 
      margin: 0;
      overflow: hidden;
      background: #111;
      color: white;
      font-family: sans-serif;
    }
    #viewer { 
      width: 100vw;
      height: 100vh;
      display: block;
    }
    .sidebar-panel {
      position: absolute;
      top: 10px;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      border-radius: 8px;
      max-height: 90vh;
      overflow-y: auto;
      box-sizing: border-box;
    }
    #sidebar {
      right: 10px;
      width: 220px;
    }
    #optionsSidebar {
      left: 10px;
      top: 80px;
      width: 15vw;
      min-width: 180px;
    }
    .sidebar-panel h2 { 
      margin-top: 0;
      font-size: 16px;
      text-align: center;
    }
    .model-entry { 
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 5px 0;
    }
    .model-entry span { 
      flex: 1;
      cursor: pointer;
    }
    .model-entry button { 
      background: #333;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-left: 4px;
    }
    .model-entry button:hover { 
      background: #555;
    }
    .option-button {
      width: 100%;
      margin: 6px 0;
      padding: 8px 10px;
      background: #222;
      color: white;
      border: 1px solid #444;
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
    }
    .option-button:hover {
      background: #333;
    }
    .option-button.active {
      background: #3a3a3a;
      border-color: #666;
    }
    .modal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.5);
      z-index: 1100;
    }
    .modal.hidden {
      display: none;
    }
    .modal-content {
      width: 320px;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 16px;
      box-sizing: border-box;
    }
    .modal-content h3 {
      margin: 0 0 12px 0;
      font-size: 16px;
      text-align: center;
    }
    .modal-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 13px;
    }
    #renameCurrentName {
      color: #ddd;
      word-break: break-all;
    }
    .modal-content label {
      display: block;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .modal-content input {
      width: 100%;
      padding: 6px 8px;
      margin-bottom: 12px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 4px;
      color: white;
      box-sizing: border-box;
    }
    .modal-actions {
      display: flex;
      gap: 8px;
    }
    .modal-actions button {
      flex: 1;
      padding: 8px 10px;
      background: #222;
      color: white;
      border: 1px solid #444;
      border-radius: 4px;
      cursor: pointer;
    }
    .modal-actions button:hover {
      background: #333;
    }
    .modal-error {
      margin-top: 8px;
      font-size: 12px;
      color: #ff6b6b;
      min-height: 14px;
    }
    #modeSelector { 
      width: 100%;
      margin-top: 10px;
      padding: 5px;
      background: #222;
      color: white;
      border: 1px solid #444;
      border-radius: 4px;
    }

    #mouse-info{
      margin-left: 12px;
    }
    
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js",
        "three/examples/jsm/loaders/OBJLoader.js": "https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/loaders/OBJLoader.js",
        "three/examples/jsm/loaders/STLLoader.js": "https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/loaders/STLLoader.js",
        "three/examples/jsm/controls/OrbitControls.js": "https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/controls/OrbitControls.js",
        "three/examples/jsm/controls/TransformControls.js": "https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/controls/TransformControls.js",
        "three/examples/jsm/exporters/STLExporter.js": "https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/exporters/STLExporter.js"
      }
    }
  </script>
</head>
<body>
  <input type="file" id="fileInput" accept=".stl" multiple style="position:absolute;z-index:10;top:10px;left:10px;color:white;"/>
  <br>
  <button id="exportCombined" style="position:absolute;z-index:10;top:40px;left: 10px;">Export combined STL</button>
  <br>
  <p id="mouse-info" hidden>mouse position:<br>x: <span id="mouse-x">0</span><br>y: <span id="mouse-y">0</span></p>
  
  <div id="optionsSidebar" class="sidebar-panel">
    <h2>Operations</h2>
    <button id="annotatePart" class="option-button">Annotate Part</button>
    <button id="relativeMeasurements" class="option-button">Find Relative Measurements</button>
    <!-- <button class="option-button">Option 3</button>
    <button class="option-button">Option 4</button> -->
  </div>
  <div id="renameModal" class="modal hidden">
    <div class="modal-content">
      <h3>Rename Part</h3>
      <div class="modal-row">
        <span>Current:</span>
        <span id="renameCurrentName"></span>
      </div>
      <label for="renameInput">New name</label>
      <input id="renameInput" type="text" autocomplete="off" />
      <div class="modal-actions">
        <button id="renameSubmit" type="button">Submit</button>
        <button id="renameCancel" type="button">Cancel</button>
      </div>
      <div id="renameError" class="modal-error"></div>
    </div>
  </div>

  <div id="sidebar" class="sidebar-panel">
    <h2>Loaded Models</h2>
    <div id="modelList"></div>
    <!-- <label for="modeSelector">Transform Mode:</label>
    <select id="modeSelector">
      <option value="translate">Translate</option>
      <option value="rotate">Rotate</option>
      <option value="scale">Scale</option>
    </select> -->
  </div>
  <canvas id="viewer"></canvas>

  <!-- Link to external JavaScript -->
  <script type="module" src="read_input_data.js"></script>
  <script type="module" src="viewer.js"></script>
  <script type="module" src="util.js"></script>
</body>
</html>
